name: cloud-network-lab

services:
  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  app:
    build: ./app
    expose:
      - "8000"
    environment:
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - backend

  loadtest:
    image: python:3.12-alpine
    volumes:
      - ./loadtest/load.py:/opt/load/load.py:ro
    entrypoint: ["python", "/opt/load/load.py"]
    environment:
      LAB_URL: "http://proxy:80"
    profiles: ["tools"]
    networks:
      - frontend

networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.10.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.20.0/24
